<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TrackFit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrackFit">
<meta name="theme-color" content="#15171a">
<link rel="apple-touch-icon" href="icon.png">
</head>
<body>
<div id="app"></div>
<style>
:root{ color-scheme: dark; }
*{box-sizing:border-box;}
html,body{ margin:0; padding:0; background:#08080c; }
:root{
  --bg: #08080c;
  --panel: rgba(22,20,20,0.82);
  --panel-raised: rgba(255,255,255,0.07);
  --line: rgba(255,255,255,0.09);
  --chalk: #f3f1fa;
  --chalk-dim: #85839a;
  --accent-1: #ff3b30;
  --accent-2: #ff9500;
  --gradient: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  --gold: #ffd60a;
  --iron: #ff3b30;
  --steel: #ff9500;
  --font-display: 'Bebas Neue', 'Oswald', Impact, sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
body{
  background: var(--bg);
  min-height: 100vh;
}
#app{
  background: var(--bg); color: var(--chalk); font-family: var(--font-body);
  min-height: 100vh; max-width: 480px; margin: 0 auto;
  padding-bottom: 96px; box-sizing: border-box; position:relative;
}
.header{ padding: 20px 16px 12px 16px; display:flex; justify-content:center; }
.logo-mark{ width: 96px; height: 96px; border-radius: 20px; filter: drop-shadow(0 0 18px rgba(255,59,48,0.3)); }

/* glass card base */
.glass{
  background: var(--panel);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
}

/* date nav */
.date-nav{ display:flex; align-items:center; justify-content:space-between; padding: 16px; gap: 10px; }
.date-btn{ background: var(--panel); backdrop-filter: blur(12px); border:1px solid var(--line); color: var(--chalk); width: 40px; height: 40px; border-radius: 12px; font-size: 18px; font-family: var(--font-mono); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.date-label-wrap{ flex:1; text-align:center; }
.date-label{ font-family: var(--font-display); font-size: 22px; letter-spacing: 1.5px; }
.date-sub{ font-size: 10px; color: var(--accent-1); font-family: var(--font-mono); margin-top:3px; letter-spacing:1px; }

/* day-type picker */
.picker-box{ margin: 0 16px 16px 16px; padding: 20px; text-align:center; background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
.picker-title{ font-family: var(--font-display); font-size: 19px; letter-spacing:1px; margin-bottom:14px; }
.picker-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.picker-option{ background: var(--panel-raised); border: 1px solid var(--line); color: var(--chalk); border-radius: 14px; padding: 16px 8px; font-family: var(--font-mono); font-size: 12px; text-transform:uppercase; letter-spacing:0.8px; transition: 0.15s; }
.picker-option.rest{ grid-column: span 2; color: var(--chalk-dim); }
.change-daytype{ text-align:center; font-size: 11px; color: var(--accent-1); font-family: var(--font-mono); letter-spacing:0.5px; margin: 0 16px 16px 16px; }
.part-chip-grid{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom: 14px; }
.part-chip{ background: var(--panel-raised); border: 1px solid var(--line); color: var(--chalk); border-radius: 20px; padding: 9px 16px; font-family: var(--font-mono); font-size: 12px; text-transform:uppercase; letter-spacing:0.5px; }
.part-chip.active{ background: var(--gradient); color:#fff; border-color:transparent; font-weight:600; box-shadow: 0 0 14px rgba(255,59,48,0.35); }
.part-section-title{ font-family: var(--font-display); font-size: 17px; letter-spacing:1px; padding: 6px 16px 8px 16px; color: var(--accent-2); }
.tmpl-day-row{ margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.tmpl-day-row:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
.tmpl-day-label{ font-family: var(--font-mono); font-size: 12px; color: var(--chalk); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; font-weight:600; }
.part-chip-sm{ padding: 6px 12px; font-size: 11px; }
.part-chip.active-rest{ background: var(--panel-raised); color: var(--chalk-dim); border-color: var(--chalk-dim); font-weight:600; }

.bw-row{ display:flex; align-items:center; justify-content:space-between; margin: 0 16px 14px 16px; padding: 14px 16px; background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 18px; }
.bw-label{ font-size: 11px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:1.5px;}
.bw-input{ background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--gold); font-family: var(--font-mono); font-size: 19px; font-weight:bold; width: 74px; text-align:right; border-radius: 10px; padding: 6px 10px; }
.bw-goal{ font-size: 11px; color: var(--chalk-dim); font-family: var(--font-mono);}

.exercise{ margin: 0 16px 14px 16px; overflow: hidden; background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
.ex-head{ display:flex; align-items:center; justify-content:space-between; padding: 14px 14px; gap: 10px; }
.ex-name{ font-weight: 600; font-size: 15px; letter-spacing:0.2px; }
.ex-target{ font-family: var(--font-mono); font-size: 11px; color: var(--chalk-dim); margin-top:3px;}
.ex-check{ width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
.ex-check.done{ background: var(--gradient); border-color: transparent; color: #fff; box-shadow: 0 0 14px rgba(255,149,0,0.5);}
.ex-video-btn{ width: 34px; height:34px; flex-shrink:0; border-radius:50%; background: var(--panel-raised); border: 1px solid var(--line); display:flex; align-items:center; justify-content:center; text-decoration:none; }
.ex-video-btn svg{ width:14px; height:14px; }
.ex-video-btn polygon{ fill: var(--accent-1) !important; }
.ex-name-wrap{ display:flex; align-items:center; gap:10px; }
.ex-remove-btn{ width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-raised); display:flex; align-items:center; justify-content:center; font-size: 12px; color: var(--chalk-dim); flex-shrink:0; }
.ex-remove-btn.confirming{ background: var(--gradient); border-color: transparent; color: #fff; }
.reorder-btn{ font-size: 9px; color: var(--chalk-dim); line-height:1; padding: 3px 5px; }
.reorder-btn.disabled{ opacity: 0.2; }
.sets-grid{ display: grid; grid-template-columns: 30px 1fr 1fr; gap: 8px; padding: 0 14px 12px 14px; }
.set-hdr{ font-size: 10px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:0.8px; text-align:center; }
.set-num{ display:flex; align-items:center; justify-content:center; font-family: var(--font-mono); color: var(--chalk-dim); font-size: 13px; }
.set-input{ background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--chalk); font-family: var(--font-mono); font-size: 14px; text-align:center; border-radius: 10px; padding: 8px 4px; width: 100%; }
.set-input:focus{ outline: none; border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(255,59,48,0.15); }
.set-controls{ display:flex; gap:8px; padding: 2px 14px 14px 14px; }
.set-ctrl-btn{ flex:1; background: var(--panel-raised); border: 1px solid var(--line); color: var(--chalk-dim); font-family: var(--font-mono); font-size: 12px; text-transform:uppercase; letter-spacing:0.5px; border-radius: 10px; padding: 8px 0; text-align:center; }
.set-ctrl-btn.remove{ color: var(--accent-2); }

.add-ex-box{ margin: 0 16px 16px 16px; padding: 14px 16px; background: var(--panel); backdrop-filter: blur(20px); border: 1px dashed rgba(255,59,48,0.3); border-radius: 16px; }
.add-ex-input{ width:100%; background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--chalk); font-family: var(--font-body); font-size: 14px; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; box-sizing: border-box; }
.action-btn{
  background: linear-gradient(rgba(255,255,255,0.03), rgba(255,255,255,0.03)) padding-box,
              var(--gradient) border-box;
  border: 1px solid transparent;
  color: var(--chalk); font-family: var(--font-mono); font-size: 11px; text-transform:uppercase; letter-spacing:1px;
  border-radius: 14px; padding: 12px 0; text-align:center;
  position: relative; overflow:hidden;
}
.action-btn.solid{
  background: var(--gradient); color:#fff; border:none; font-weight:600;
  box-shadow: 0 4px 20px rgba(255,59,48,0.3);
}
.btn-content{ display:flex; align-items:center; justify-content:center; gap:7px; }
.btn-content svg{ width:15px; height:15px; flex-shrink:0; }

.progress-strip{ margin: 6px 16px 20px 16px; padding: 16px; display:flex; align-items:center; justify-content:space-between; background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 18px; }
.progress-strip .num{ font-family: var(--font-display); font-size: 24px; background: var(--gradient); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.progress-strip .lbl{ font-size: 11px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:0.8px;}

/* calendar */
.cal-header{ display:flex; align-items:center; justify-content:space-between; padding: 16px; }
.cal-month{ font-family: var(--font-display); font-size: 23px; letter-spacing:1.5px; }
.cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:5px; padding: 0 12px 16px 12px; }
.cal-dow{ text-align:center; font-size:10px; color: var(--chalk-dim); font-family: var(--font-mono); padding-bottom:4px; }
.cal-cell{ aspect-ratio: 1; border-radius: 12px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; font-family: var(--font-mono); font-size: 12px; gap:2px; position:relative; }
.cal-cell.empty{ background:transparent; border:none; backdrop-filter:none; }
.cal-cell.today{ border-color: var(--accent-1); box-shadow: 0 0 10px rgba(255,59,48,0.3); }
.cal-cell.selected{ border-color: var(--accent-2); border-width:2px; }
.cal-badge{ font-size: 8px; padding: 1px 5px; border-radius: 5px; background: var(--steel); color: #08080c; font-weight:bold; }
.cal-badge.push{ background: var(--gradient); color:#fff; }
.cal-badge.pull{ background: var(--accent-1); color:#fff; }
.cal-badge.legs{ background: var(--gold); color:#08080c; }
.cal-legend{ display:flex; gap:12px; padding: 0 16px 16px 16px; font-size:10px; color:var(--chalk-dim); font-family: var(--font-mono); flex-wrap:wrap; }
.cal-legend span{ display:inline-flex; align-items:center; gap:4px; }
.legend-dot{ width:8px; height:8px; border-radius:3px; display:inline-block; }

/* progress tab */
.section-title{ font-family: var(--font-display); font-size: 19px; letter-spacing:1px; padding: 18px 16px 10px 16px; }
.progress-list{ margin: 0 16px 16px 16px; overflow:hidden; background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 18px; }
.progress-row{ display:flex; justify-content:space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
.progress-row:last-child{ border-bottom:none; }
.progress-row .pdate{ color: var(--chalk-dim); font-family: var(--font-mono); font-size:12px; }
.progress-row .pval{ font-family: var(--font-mono); color: var(--gold); font-weight:bold; }
.empty-note{ padding: 0 16px 16px 16px; color: var(--chalk-dim); font-size: 13px; }
.range-pills{ display:flex; gap:8px; margin: 0 16px 12px 16px; }
.range-pill{ flex:1; text-align:center; background: var(--panel); border: 1px solid var(--line); color: var(--chalk-dim); font-family: var(--font-mono); font-size: 11px; letter-spacing:0.5px; padding: 8px 0; border-radius: 10px; }
.range-pill.active{ background: var(--gradient); color:#fff; border-color:transparent; font-weight:600; }
.chart-card{ margin: 0 16px 16px 16px; padding: 16px 12px; background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 18px; }
.backup-textarea{ width: 100%; min-height: 90px; background: rgba(255,255,255,0.05); color: var(--chalk); border: 1px solid var(--line); border-radius: 12px; font-family: var(--font-mono); font-size: 10px; padding: 10px; margin-top: 8px; box-sizing: border-box; }
.backup-row{ display:flex; gap:8px; margin: 0 16px 16px 16px; }

/* bottom nav — floating glass pill */
.bottom-nav{
  position: fixed; bottom: 14px; left:50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 448px;
  background: rgba(20,18,28,0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  display:flex; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)) 10px;
  z-index: 50;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 30px rgba(255,59,48,0.08);
}
.nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding: 6px 0; color: var(--chalk-dim); border-radius: 14px; }
.nav-btn.active{ color: #fff; background: var(--gradient); box-shadow: 0 0 16px rgba(255,149,0,0.4); }
.nav-btn svg{ width:20px; height:20px; }
.nav-label{ font-size: 10px; font-family: var(--font-mono); text-transform:uppercase; letter-spacing:0.5px; }
</style>

  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function toISO(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  function fromISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
  function todayISO(){ return toISO(new Date()); }

  function videoBtn(ex){
    let href;
    if(ex.video && /^https?:\/\//.test(ex.video)){ href = ex.video; }
    else if(ex.video){ href = `https://www.youtube.com/shorts/${ex.video}`; }
    else{ href = `https://www.youtube.com/@athleanx/search?query=${encodeURIComponent(ex.n.replace(/\//g,' ') + " form")}`; }
    return `<a class="ex-video-btn" href="${href}" target="_blank" rel="noopener noreferrer" title="Watch form video">
      <svg viewBox="0 0 24 24" fill="var(--iron)"><polygon points="6,4 20,12 6,20"/></svg>
    </a>`;
  }

  // ---- storage layer ----
  let memoryFallback = {};
  let usingFallback = (typeof window.storage === 'undefined');
  function localStorageWorks(){
    try{ const k="__trackfit_test__"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  }
  let usingLocalStorage = usingFallback ? localStorageWorks() : false;

  async function genericGet(key){
    if(usingFallback){
      if(usingLocalStorage){ const raw = window.localStorage.getItem(key); return raw || null; }
      return memoryFallback[key] || null;
    }
    try{ const res = await window.storage.get(key, false); return res ? res.value : null; }
    catch(e){ return null; }
  }
  async function genericSet(key, value){
    if(usingFallback){
      if(usingLocalStorage){ window.localStorage.setItem(key, value); } else { memoryFallback[key] = value; }
      return;
    }
    try{
      const result = await window.storage.set(key, value, false);
      if(!result) throw new Error("empty result");
    }catch(e){
      usingFallback = true; usingLocalStorage = localStorageWorks();
      if(usingLocalStorage){ window.localStorage.setItem(key, value); } else { memoryFallback[key] = value; }
    }
  }
  async function genericListKeys(prefix){
    if(usingFallback){
      if(usingLocalStorage){
        const out = [];
        for(let i=0;i<window.localStorage.length;i++){ const k = window.localStorage.key(i); if(k && k.startsWith(prefix)) out.push(k); }
        return out;
      }
      return Object.keys(memoryFallback).filter(k => k.startsWith(prefix));
    }
    try{
      const res = await window.storage.list(prefix, false);
      return res && res.keys ? res.keys : [];
    }catch(e){ return []; }
  }

  function dateKey(dateStr){ return `date:${dateStr}`; }
  async function loadDateData(dateStr){
    const raw = await genericGet(dateKey(dateStr));
    if(raw) return JSON.parse(raw);
    // no explicit record for this date yet — derive default from the weekly template
    const template = await loadWeeklyTemplate();
    const dow = WEEKDAY_KEYS[fromISO(dateStr).getDay()];
    const dayT = template[dow] || { parts: [], isRest: false };
    return { parts: [...(dayT.parts||[])], isRest: !!dayT.isRest, bw: "", done: {}, sets: {} };
  }
  async function saveDateData(dateStr, data){ await genericSet(dateKey(dateStr), JSON.stringify(data)); }

  async function loadProfile(){
    const raw = await genericGet(PROFILE_KEY);
    return raw ? JSON.parse(raw) : null;
  }
  async function saveProfile(p){ await genericSet(PROFILE_KEY, JSON.stringify(p)); }

  const TEMPLATE_KEY = "trackfit-weekly-template";
  const WEEKDAY_KEYS = ["sun","mon","tue","wed","thu","fri","sat"]; // matches Date.getDay() index
  const WEEKDAY_DISPLAY_ORDER = ["mon","tue","wed","thu","fri","sat","sun"];
  const WEEKDAY_LABELS = { mon:"Monday", tue:"Tuesday", wed:"Wednesday", thu:"Thursday", fri:"Friday", sat:"Saturday", sun:"Sunday" };
  async function loadWeeklyTemplate(){
    const raw = await genericGet(TEMPLATE_KEY);

  function getEffectiveExercises(dayId, overrides){
    const o = (overrides && overrides[dayId]) || { removedBase: [], custom: [], edits: {}, order: [] };
    const edits = o.edits || {};
    const base = PLAN[dayId].exercises
      .map((ex,i) => ({...ex, key:`b${i}`, isCustom:false, baseIndex:i}))
      .filter(ex => !(o.removedBase||[]).includes(ex.baseIndex));
    const custom = (o.custom||[]).map(c => ({ n:c.n, t:c.t||"", video:c.video||null, key:c.id, isCustom:true }));
    let combined = [...base, ...custom].map(ex => {
      const e = edits[ex.key];
      if(!e) return ex;
      return { ...ex, n: e.n ?? ex.n, t: e.t ?? ex.t, video: (e.video !== undefined ? e.video : ex.video) };
    });
    const order = o.order;
    if(order && order.length){
      const orderIndex = {};
      order.forEach((k,i) => { orderIndex[k] = i; });
      combined.sort((a,b) => {
        const ia = orderIndex[a.key] !== undefined ? orderIndex[a.key] : order.length + 999;
        const ib = orderIndex[b.key] !== undefined ? orderIndex[b.key] : order.length + 999;
        return ia - ib;
      });
    }
    return combined;
  }

  function ensureSets(dayData, key){
    if(!dayData.sets[key]){ dayData.sets[key] = [{w:"",r:""},{w:"",r:""},{w:"",r:""},{w:"",r:""}]; }
    return dayData.sets[key];
  }

  async function findLastPartSession(partId, beforeDate){
    const keys = await genericListKeys('date:');
    const dates = keys.map(k => k.replace('date:','')).filter(d => d < beforeDate).sort().reverse();
    const prefix = `${partId}__`;
    for(const d of dates){
      const raw = await genericGet(dateKey(d));
      if(raw){
        try{
          const parsed = JSON.parse(raw);
          const sets = parsed.sets || {};
          const hasPart = Object.keys(sets).some(k => k.startsWith(prefix));
          if(hasPart) return { date: d, data: parsed };
        }catch(e){}
      }
    }
    return null;
  }

  function bestSetLabel(sets){
    if(!sets) return null;
    const valid = sets.filter(s => s.w !== "" && s.r !== "" && s.w != null && s.r != null);
    if(valid.length === 0) return null;
    let best = valid[0];
    valid.forEach(s => { if(parseFloat(s.w) > parseFloat(best.w)) best = s; });
    return `${best.w}kg × ${best.r}`;
  }

  function bestSetNumeric(sets){
    if(!sets) return null;
    const valid = sets.filter(s => s.w !== "" && s.w != null && !isNaN(parseFloat(s.w)));
    if(valid.length === 0) return null;
    let best = valid[0];
    valid.forEach(s => { if(parseFloat(s.w) > parseFloat(best.w)) best = s; });
    return { w: parseFloat(best.w), r: parseFloat(best.r) || 0 };
  }

  async function computePartPRs(partId, excludeDate){
    const keys = await genericListKeys('date:');
    const prMap = {};
    const prefix = `${partId}__`;
    for(const k of keys){
      const ds = k.replace('date:','');
      if(ds === excludeDate) continue;
      const raw = await genericGet(k);
      if(!raw) continue;
      try{
        const parsed = JSON.parse(raw);
        const sets = parsed.sets || {};
        for(const exKey in sets){
          if(!exKey.startsWith(prefix)) continue;
          const best = bestSetNumeric(sets[exKey]);
          if(best && (!prMap[exKey] || best.w > prMap[exKey].w)){
            prMap[exKey] = best;
          }
        }
      }catch(e){}
    }
    return prMap;
  }

  async function computeStats(){
    const keys = await genericListKeys('date:');
    const entries = [];
    for(const k of keys){
      const raw = await genericGet(k);
      if(raw){
        try{ entries.push({ date: k.replace('date:',''), ...JSON.parse(raw) }); }catch(e){}
      }
    }
    const entryByDate = {};
    entries.forEach(e => { entryByDate[e.date] = e; });

    const today = new Date();
    const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate()-6);
    const weekAgoStr = toISO(weekAgo);

    let allTimeVolume = 0, weekVolume = 0;
    entries.forEach(e => {
      const sets = e.sets || {};
      let dayVol = 0;
      for(const k in sets){
        sets[k].forEach(s => {
          const w = parseFloat(s.w), r = parseFloat(s.r);
          if(!isNaN(w) && !isNaN(r)) dayVol += w*r;
        });
      }
      allTimeVolume += dayVol;
      if(e.date >= weekAgoStr) weekVolume += dayVol;
    });

    // streak: walk backward from today; rest days pass through, missing/incomplete days break it
    let streak = 0;
    let cursor = new Date();
    let guard = 0;
    while(guard < 400){
      guard++;
      const ds = toISO(cursor);
      const e = entryByDate[ds];
      if(!e || (!e.isRest && (!e.parts || e.parts.length === 0))) break;
      if(e.isRest){ cursor.setDate(cursor.getDate()-1); continue; }
      const doneCount = Object.values(e.done||{}).filter(Boolean).length;
      if(doneCount === 0) break;
      streak++;
      cursor.setDate(cursor.getDate()-1);
    }

    return { allTimeVolume: Math.round(allTimeVolume), weekVolume: Math.round(weekVolume), streak };
  }

  function buildBWChart(entriesAsc, width, height){
    if(entriesAsc.length === 0) return '';
    const padding = { top: 18, right: 14, bottom: 22, left: 38 };
    const w = width - padding.left - padding.right;
    const h = height - padding.top - padding.bottom;

    const weights = entriesAsc.map(e => parseFloat(e.bw));
    let minW = Math.min(...weights), maxW = Math.max(...weights);
    if(minW === maxW){ minW -= 1; maxW += 1; }
    const pad = (maxW - minW) * 0.15 || 1;
    minW -= pad; maxW += pad;

    const single = entriesAsc.length === 1;
    const dates = entriesAsc.map(e => fromISO(e.date).getTime());
    const minD = Math.min(...dates), maxD = Math.max(...dates);
    const dRange = (maxD - minD) || 1;

    const points = entriesAsc.map(e => {
      const t = fromISO(e.date).getTime();
      const x = single ? (padding.left + w/2) : (padding.left + ((t - minD) / dRange) * w);
      const y = padding.top + h - ((parseFloat(e.bw) - minW) / (maxW - minW)) * h;
      return { x, y, bw: e.bw, date: e.date };
    });

    const pathD = points.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${(padding.top+h).toFixed(1)} L${points[0].x.toFixed(1)},${(padding.top+h).toFixed(1)} Z`;

    let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block;">`;
    svg += `<defs>
      <linearGradient id="bwArea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff9500" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="bwLine" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ff3b30"/>
        <stop offset="100%" stop-color="#ff9500"/>
      </linearGradient>
    </defs>`;
    // gridlines
    [0.25, 0.5, 0.75].forEach(f => {
      const gy = padding.top + h * f;
      svg += `<line x1="${padding.left}" y1="${gy.toFixed(1)}" x2="${(padding.left+w).toFixed(1)}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
    });
    svg += `<path d="${areaD}" fill="url(#bwArea)" stroke="none"/>`;
    svg += `<path d="${pathD}" fill="none" stroke="url(#bwLine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    points.forEach((p,i) => {
      const isLast = i === points.length-1;
      svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast?4:2.5}" fill="${isLast?'#ff9500':'#08080c'}" stroke="#ff9500" stroke-width="2"/>`;
    });
    svg += `<text x="2" y="${(padding.top+3).toFixed(1)}" font-size="9" fill="#85839a" font-family="monospace">${maxW.toFixed(1)}</text>`;
    svg += `<text x="2" y="${(padding.top+h).toFixed(1)}" font-size="9" fill="#85839a" font-family="monospace">${minW.toFixed(1)}</text>`;
    if(points.length){
      const first = points[0], last = points[points.length-1];
      svg += `<text x="${first.x.toFixed(1)}" y="${height-4}" font-size="8" fill="#85839a" font-family="monospace" text-anchor="start">${fromISO(first.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`;
      if(!single){
        svg += `<text x="${last.x.toFixed(1)}" y="${height-4}" font-size="8" fill="#85839a" font-family="monospace" text-anchor="end">${fromISO(last.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`;
      }
    }
    svg += `</svg>`;
    return svg;
  }

  // ---- CALENDAR TAB ----
  async function renderCalendar(){
    const year = state.calYear, month = state.calMonth;
    const first = new Date(year, month, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();

    const keys = await genericListKeys('date:');
    const monthPrefix = `date:${year}-${pad2(month+1)}`;
    const relevantKeys = keys.filter(k => k.startsWith(monthPrefix));
    const dataMap = {};
    for(const k of relevantKeys){
      const raw2 = await genericGet(k);
      if(raw2){
        try{
          const parsed = JSON.parse(raw2);
          const ds = k.replace('date:','');
          dataMap[ds] = parsed;
        }catch(e){}
      }
    }

    let html = `<div class="cal-header">
      <div class="date-btn" data-action="prev-month">‹</div>
      <div class="cal-month">${MONTH_NAMES[month]} ${year}</div>
      <div class="date-btn" data-action="next-month">›</div>
    </div>`;

    html += `<div class="cal-grid">`;
    DOW.forEach(d => html += `<div class="cal-dow">${d}</div>`);
    for(let i=0;i<startDow;i++){ html += `<div class="cal-cell empty"></div>`; }
    for(let d=1; d<=daysInMonth; d++){
      const ds = `${year}-${pad2(month+1)}-${pad2(d)}`;
      const isToday = ds === todayISO();
      const isSelected = ds === state.selectedDate;
      const entry = dataMap[ds];
      let badges = '';
      if(entry && entry.isRest){
        badges = `<div class="cal-badge" style="background:var(--chalk-dim);">R</div>`;
      }else if(entry && entry.parts && entry.parts.length){
        const shown = entry.parts.slice(0,2);
        badges = `<div style="display:flex; gap:2px; flex-wrap:wrap; justify-content:center;">`;
        shown.forEach(p => { badges += `<div class="cal-badge push">${PART_ABBR[p]}</div>`; });
        if(entry.parts.length > 2){ badges += `<div class="cal-badge" style="background:var(--panel-raised); color:var(--chalk-dim);">+${entry.parts.length-2}</div>`; }
        badges += `</div>`;
      }
      html += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" data-action="select-date" data-date="${ds}">
        <div>${d}</div>${badges}
      </div>`;
    }
    html += `</div>`;

    html += `<div class="cal-legend">
      <span><span class="legend-dot" style="background:var(--gradient);"></span>Trained</span>
      <span><span class="legend-dot" style="background:var(--chalk-dim);"></span>Rest</span>
    </div>`;
    html += `<div class="empty-note">Tap a date to view or log that day.</div>`;
    return html;
  }

  // ---- PROGRESS TAB ----
  async function renderProgress(){
    const keys = await genericListKeys('date:');
    const entries = [];
    for(const k of keys){
      const raw = await genericGet(k);
      if(raw){
        try{
          const parsed = JSON.parse(raw);
          entries.push({ date: k.replace('date:',''), bw: parsed.bw, parts: parsed.parts, doneCount: Object.values(parsed.done||{}).filter(Boolean).length });
        }catch(e){}
      }
    }
    entries.sort((a,b) => a.date < b.date ? 1 : -1);
    const bwEntries = entries.filter(e => e.bw);

    const stats = await computeStats();
    let html = `<div class="section-title">STATS</div>`;
    html += `<div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin:0 16px 16px 16px;">
      <div class="progress-strip" style="margin:0; flex-direction:column; align-items:flex-start; gap:2px;">
        <div class="num">🔥 ${stats.streak}</div><div class="lbl">Day streak</div>
      </div>
      <div class="progress-strip" style="margin:0; flex-direction:column; align-items:flex-start; gap:2px;">
        <div class="num">${stats.weekVolume.toLocaleString()}</div><div class="lbl">This week (kg lifted)</div>
      </div>
      <div class="progress-strip" style="margin:0; flex-direction:column; align-items:flex-start; gap:2px; grid-column: span 2;">
        <div class="num">${stats.allTimeVolume.toLocaleString()}</div><div class="lbl">All-time volume (kg lifted)</div>
      </div>
    </div>`;

    html += `<div class="section-title">BODYWEIGHT</div>`;
    if(bwEntries.length === 0){
      html += `<div class="empty-note">No bodyweight entries yet — log one from the Log tab.</div>`;
    }else{
      const rangeDays = { '1w':7, '1m':30, '3m':90, '6m':180 };
      const rangeLabels = { '1w':'1W', '1m':'1M', '3m':'3M', '6m':'6M' };
      html += `<div class="range-pills">`;
      Object.keys(rangeDays).forEach(r => {
        html += `<div class="range-pill ${state.bwRange===r?'active':''}" data-action="set-bw-range" data-range="${r}">${rangeLabels[r]}</div>`;
      });
      html += `</div>`;

      const days = rangeDays[state.bwRange] || 30;
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
      const cutoffStr = toISO(cutoff);
      const chartEntries = bwEntries.filter(e => e.date >= cutoffStr).slice().sort((a,b) => a.date < b.date ? -1 : 1);

      if(chartEntries.length === 0){
        html += `<div class="empty-note">No entries in this range.</div>`;
      }else{
        html += `<div class="chart-card">${buildBWChart(chartEntries, 320, 150)}</div>`;
        const latest = chartEntries[chartEntries.length-1];
        const earliest = chartEntries[0];
        const delta = (parseFloat(latest.bw) - parseFloat(earliest.bw)).toFixed(1);
        const deltaSign = delta >= 0 ? '+' : '';
        html += `<div class="progress-strip" style="margin-top:0;">
          <div><div class="num">${latest.bw}kg</div><div class="lbl">Latest</div></div>
          <div style="text-align:right;"><div class="num" style="font-size:18px;">${deltaSign}${delta}kg</div><div class="lbl">Change this range</div></div>
        </div>`;
      }
    }

    return html;
  }

      <div class="action-btn solid" data-action="export-data">
        <span class="btn-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M12 3l-4 4M12 3l4 4"/><path d="M4 15v4a2 2 0 002 2h12a2 2 0 002-2v-4"/></svg>
          Export backup
        </span>
      </div>
      <div class="action-btn solid" data-action="import-data">
        <span class="btn-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Restore backup
        </span>
      </div>
    </div>`;
    if(state.showBackupBox){
      html += `<div style="margin:0 16px 20px 16px;">
        <textarea class="backup-textarea" id="backup-textarea" placeholder="${state.backupMode==='import' ? 'Paste your backup text here, then tap Restore backup again' : ''}">${state.backupMode==='export' ? state.backupText : ''}</textarea>

  // ---- handlers ----
  function attachHandlers(){
    const app = document.getElementById("app");
    attachTemplateHandlers(app);

    app.querySelectorAll('[data-action="switch-tab"]').forEach(el => {
      el.onclick = () => { state.activeTab = el.getAttribute('data-tab'); render(); };
    });

    app.querySelectorAll('[data-action="prev-date"]').forEach(el => {
      el.onclick = () => { const d = fromISO(state.selectedDate); d.setDate(d.getDate()-1); state.selectedDate = toISO(d); render(); };
    });
    app.querySelectorAll('[data-action="next-date"]').forEach(el => {
      el.onclick = () => { const d = fromISO(state.selectedDate); d.setDate(d.getDate()+1); state.selectedDate = toISO(d); render(); };
    });

    app.querySelectorAll('[data-action="toggle-part"]').forEach(el => {
      el.onclick = async () => {
        const part = el.getAttribute('data-part');
        const dd = state.currentDateData || await loadDateData(state.selectedDate);
        if(!dd.parts) dd.parts = [];
        dd.isRest = false;
        const idx = dd.parts.indexOf(part);
        if(idx === -1){ dd.parts.push(part); } else { dd.parts.splice(idx, 1); }
        await saveDateData(state.selectedDate, dd);
        render();
      };
    });
    app.querySelectorAll('[data-action="toggle-rest-day"]').forEach(el => {
      el.onclick = async () => {
        const dd = state.currentDateData;
        if(dd.isRest){
          dd.isRest = false;
        }else{
          dd.isRest = true;
          dd.parts = [];
        }
        await saveDateData(state.selectedDate, dd);
        render();
      };
    });

    const bwInput = document.getElementById('bw-input');
    if(bwInput){
      bwInput.onchange = async (e) => {
        const dd = state.currentDateData;
        dd.bw = e.target.value;
        await saveDateData(state.selectedDate, dd);
      };
    }

    app.querySelectorAll('[data-action="copy-last-session"]').forEach(el => {
      el.onclick = async () => {
        const partId = el.getAttribute('data-partid');
        const lastSession = await findLastPartSession(partId, state.selectedDate);
        if(!lastSession) return;
        const dd = state.currentDateData;
        const lastSets = lastSession.data.sets || {};
        const prefix = `${partId}__`;
        for(const key in lastSets){
          if(!key.startsWith(prefix)) continue;
          dd.sets[key] = lastSets[key].map(s => ({ w: s.w, r: s.r }));
        }
        await saveDateData(state.selectedDate, dd);
        render();
      };
    });

    app.querySelectorAll('[data-action="toggle-done"]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-key');
        const dd = state.currentDateData;
        dd.done[key] = !dd.done[key];
        await saveDateData(state.selectedDate, dd);
        render();
      };
    });

    app.querySelectorAll('[data-action="add-set"]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-key');
        const dd = state.currentDateData;
        ensureSets(dd, key).push({w:"",r:""});
        await saveDateData(state.selectedDate, dd);
        render();
      };
    });
    app.querySelectorAll('[data-action="remove-set"]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-key');
        const dd = state.currentDateData;
        const sets = ensureSets(dd, key);
        if(sets.length > 1){ sets.pop(); }
        await saveDateData(state.selectedDate, dd);
        render();
      };
    });
    app.querySelectorAll('[data-action="set-weight"], [data-action="set-reps"]').forEach(el => {
      el.onchange = async (e) => {
        const key = el.getAttribute('data-key');
        const si = el.getAttribute('data-si');
        const dd = state.currentDateData;
        const sets = ensureSets(dd, key);
        const field = el.getAttribute('data-action')==='set-weight' ? 'w' : 'r';
        sets[si][field] = e.target.value;
        const allFilled = sets.length > 0 && sets.every(s => s.w !== "" && s.w != null && s.r !== "" && s.r != null);
        const wasFilled = !!dd.done[key];
        dd.done[key] = allFilled;
        await saveDateData(state.selectedDate, dd);
        if(allFilled !== wasFilled){ render(); }
      };
    });

    app.querySelectorAll('[data-action="toggle-add-exercise"]').forEach(el => {
      el.onclick = () => {
        const partId = el.getAttribute('data-partid');
        if(state.showAddExerciseFor === partId){
          state.showAddExerciseFor = null;
        }else{
          state.showAddExerciseFor = partId;
          state.newExName = ""; state.newExTarget = ""; state.newExVideo = "";
        }
        render();
      };
    });
    app.querySelectorAll('[data-action="cancel-add-exercise"]').forEach(el => {
      el.onclick = () => {
        state.showAddExerciseFor = null;
        render();
      };
    });
    app.querySelectorAll('[data-action="save-new-exercise"]').forEach(el => {
      el.onclick = async () => {
        const partId = el.getAttribute('data-partid');
        const nameEl = document.getElementById('new-ex-name');
        const targetEl = document.getElementById('new-ex-target');
        const videoEl = document.getElementById('new-ex-video');
        const name = (nameEl.value||"").trim();
        if(!name){ nameEl.style.borderColor='var(--accent-1)'; nameEl.placeholder='Name is required'; return; }
        const overrides = state.currentOverrides || {};
        if(!overrides[partId]) overrides[partId] = { removedBase:[], custom:[] };
        overrides[partId].custom.push({ id:"c"+Date.now()+Math.floor(Math.random()*1000), n:name, t:(targetEl.value||"").trim(), video:(videoEl.value||"").trim()||null });
        await saveOverrides(overrides);
        state.showAddExerciseFor = null;
        render();
      };
    });
    app.querySelectorAll('[data-action="move-exercise"]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-key');
        const partId = el.getAttribute('data-partid');
        const dir = el.getAttribute('data-dir');
        const overrides = state.currentOverrides || {};
        if(!overrides[partId]) overrides[partId] = { removedBase:[], custom:[], edits:{}, order:[] };
        const currentList = getEffectiveExercises(partId, overrides);
        const orderKeys = currentList.map(e => e.key);
        const idx = orderKeys.indexOf(key);
        if(idx === -1) return;
        const swapIdx = dir === 'up' ? idx-1 : idx+1;
        if(swapIdx < 0 || swapIdx >= orderKeys.length) return;
        [orderKeys[idx], orderKeys[swapIdx]] = [orderKeys[swapIdx], orderKeys[idx]];
        overrides[partId].order = orderKeys;
        await saveOverrides(overrides);
        render();
      };
    });
    app.querySelectorAll('[data-action="toggle-edit-exercise"]').forEach(el => {
      el.onclick = () => {
        const key = el.getAttribute('data-key');
        if(state.editingKey === key){
          state.editingKey = null;
        }else{
          state.editingKey = key;
          state.editName = el.getAttribute('data-name') || '';
          state.editTarget = el.getAttribute('data-target') || '';
          state.editVideo = el.getAttribute('data-video') || '';
        }
        render();
      };
    });
    app.querySelectorAll('[data-action="cancel-edit-exercise"]').forEach(el => {
      el.onclick = () => { state.editingKey = null; render(); };
    });
    app.querySelectorAll('[data-action="save-edit-exercise"]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-key');
        const partId = el.getAttribute('data-partid');
        const nameEl = document.getElementById('edit-ex-name');
        const targetEl = document.getElementById('edit-ex-target');
        const videoEl = document.getElementById('edit-ex-video');
        const name = (nameEl.value||"").trim();
        if(!name){ nameEl.style.borderColor='var(--accent-1)'; nameEl.placeholder='Name is required'; return; }
        const overrides = state.currentOverrides || {};
        if(!overrides[partId]) overrides[partId] = { removedBase:[], custom:[], edits:{} };
        if(!overrides[partId].edits) overrides[partId].edits = {};
        overrides[partId].edits[key] = { n: name, t: (targetEl.value||"").trim(), video: (videoEl.value||"").trim() || null };
        await saveOverrides(overrides);
        state.editingKey = null;
        render();
      };
    });

    app.querySelectorAll('[data-action="remove-exercise"]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-key');
        const isCustom = el.getAttribute('data-custom')==='1';
        const partId = el.getAttribute('data-partid');
        if(state.pendingRemoveKey !== key){ state.pendingRemoveKey = key; render(); return; }
        state.pendingRemoveKey = null;
        const overrides = state.currentOverrides || {};
        if(!overrides[partId]) overrides[partId] = { removedBase:[], custom:[], edits:{} };
        if(isCustom){
          overrides[partId].custom = (overrides[partId].custom||[]).filter(c => c.id !== key);
        }else{
          const baseIndex = parseInt(key.replace('b',''),10);
          if(!overrides[partId].removedBase.includes(baseIndex)) overrides[partId].removedBase.push(baseIndex);
        }
        if(overrides[partId].edits && overrides[partId].edits[key]){ delete overrides[partId].edits[key]; }
        await saveOverrides(overrides);
        render();
      };
    });

    app.querySelectorAll('[data-action="prev-month"]').forEach(el => {
      el.onclick = () => { state.calMonth--; if(state.calMonth<0){ state.calMonth=11; state.calYear--; } render(); };
    });
    app.querySelectorAll('[data-action="next-month"]').forEach(el => {
      el.onclick = () => { state.calMonth++; if(state.calMonth>11){ state.calMonth=0; state.calYear++; } render(); };
    });
    app.querySelectorAll('[data-action="select-date"]').forEach(el => {
      el.onclick = () => { state.selectedDate = el.getAttribute('data-date'); state.activeTab='log'; render(); };
    });

    app.querySelectorAll('[data-action="set-bw-range"]').forEach(el => {
      el.onclick = () => { state.bwRange = el.getAttribute('data-range'); render(); };
    });

    app.querySelectorAll('[data-action="edit-profile"]').forEach(el => {
      el.onclick = () => { state.editingProfile = true; render(); };
    });
    app.querySelectorAll('[data-action="cancel-profile-edit"]').forEach(el => {
      el.onclick = () => { state.editingProfile = false; render(); };
    });
    app.querySelectorAll('[data-action="save-profile-edit"]').forEach(el => {
      el.onclick = async () => {
        const name = (document.getElementById('ep-name').value || '').trim();
        const height = (document.getElementById('ep-height').value || '').trim();
        const start = (document.getElementById('ep-start').value || '').trim();
        const goal = (document.getElementById('ep-goal').value || '').trim();
        if(!height || !start || !goal) return;
        const profile = { name, height, startWeight: start, goalWeight: goal };
        await saveProfile(profile);
        state.profile = profile;
        state.editingProfile = false;
        render();
      };
    });

    app.querySelectorAll('[data-action="export-data"]').forEach(el => {
      el.onclick = async () => {
        const keys = await genericListKeys('date:');
        const all = {};
        for(const k of keys){ const raw = await genericGet(k); if(raw) all[k] = JSON.parse(raw); }
        state.backupText = JSON.stringify(all);
        state.backupMode = 'export'; state.showBackupBox = true;
        render();
      };
    });
    app.querySelectorAll('[data-action="import-data"]').forEach(el => {
      el.onclick = async () => {
        if(state.showBackupBox && state.backupMode==='import'){
          const box = document.getElementById('backup-textarea');
          try{
            const parsed = JSON.parse(box.value);
            for(const k in parsed){ await genericSet(k, JSON.stringify(parsed[k])); }
            state.showBackupBox = false;
            render();
          }catch(e){
            box.placeholder = "Couldn't read that — check it's pasted correctly and try again.";
          }
        }else{
          state.backupMode = 'import'; state.showBackupBox = true; render();
        }
      };
    });
  }

  render();
})();
</script>
</body>
</html>
