<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TrackFit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrackFit">
<meta name="theme-color" content="#15171a">
<link rel="apple-touch-icon" href="icon.png">
</head>
<body>
<div id="app"></div>
<style>
:root{
  color-scheme: dark;
}
  :root{
    --bg: #15171a;
    --panel: #1d2024;
    --panel-raised: #24282d;
    --line: #33383e;
    --chalk: #ece7dc;
    --chalk-dim: #9a9d9f;
    --iron: #c94f3d;
    --steel: #5b8a8e;
    --font-display: 'Bebas Neue', 'Oswald', Impact, sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  }
  #app{
    background: var(--bg);
    color: var(--chalk);
    font-family: var(--font-body);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 40px;
    box-sizing: border-box;
  }
  *{box-sizing:border-box;}
  .plate-row{
    display:flex; align-items:center; gap:2px; padding: 18px 16px 6px 16px;
  }
  .plate{
    width:8px; height:26px; border-radius:2px; background:var(--iron); opacity:0.85;
  }
  .plate:nth-child(2){height:22px; background:var(--steel); opacity:0.7;}
  .plate:nth-child(3){height:30px;}
  .header{
    padding: 0 16px 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .title{
    font-family: var(--font-display);
    letter-spacing: 1.5px;
    font-size: 34px;
    line-height:1;
    margin:0;
  }
  .subtitle{
    color: var(--chalk-dim);
    font-size: 13px;
    margin-top: 4px;
    font-family: var(--font-mono);
  }
  .week-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px; gap: 10px;
  }
  .week-btn{
    background: var(--panel); border:1px solid var(--line); color: var(--chalk);
    width: 38px; height: 38px; border-radius: 8px; font-size: 18px; font-family: var(--font-mono);
    display:flex; align-items:center; justify-content:center;
  }
  .week-label{
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 1px;
    flex:1;
    text-align:center;
  }
  .bw-row{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--panel); margin: 0 16px 14px 16px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line);
  }
  .bw-label{ font-size: 12px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:1px;}
  .bw-input{
    background: var(--panel-raised); border: 1px solid var(--line); color: var(--iron);
    font-family: var(--font-mono); font-size: 18px; font-weight:bold; width: 70px; text-align:right;
    border-radius: 6px; padding: 5px 8px;
  }
  .bw-goal{ font-size: 11px; color: var(--chalk-dim); font-family: var(--font-mono);}
  .day-tabs{
    display:flex; overflow-x:auto; gap:8px; padding: 0 16px 16px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .day-tab{
    flex-shrink:0; padding: 8px 14px; border-radius: 20px; font-size: 12px;
    font-family: var(--font-mono); letter-spacing: 0.5px; text-transform:uppercase;
    border: 1px solid var(--line); background: var(--panel); color: var(--chalk-dim);
  }
  .day-tab.active{
    background: var(--iron); color: var(--bg); border-color: var(--iron); font-weight:bold;
  }
  .date-row{
    display:flex; align-items:center; justify-content:space-between;
    margin: 0 16px 14px 16px; padding: 10px 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .date-label{ font-size: 12px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:1px;}
  .date-input{
    background: var(--panel-raised); border: 1px solid var(--line); color: var(--chalk);
    font-family: var(--font-mono); font-size: 14px; border-radius: 6px; padding: 6px 10px;
  }
  .ex-video-btn{
    width: 32px; height:32px; flex-shrink:0; border-radius:50%;
    background: var(--panel-raised); border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center; text-decoration:none;
  }
  .ex-video-btn svg{ width:14px; height:14px; }
  .ex-name-wrap{ display:flex; align-items:center; gap:10px; }
  .day-tab .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--steel);
    margin-left:6px; vertical-align:middle;
  }
  .day-tab.active .dot{ background: var(--bg); }
  .exercise{
    margin: 0 16px 12px 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
  }
  .ex-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 14px; gap: 10px;
  }
  .ex-name{ font-weight: 600; font-size: 15px; }
  .ex-target{ font-family: var(--font-mono); font-size: 11px; color: var(--chalk-dim); margin-top:2px;}
  .ex-check{
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .ex-check.done{ background: var(--steel); border-color: var(--steel); color: var(--bg);}
  .sets-grid{
    display: grid; grid-template-columns: 30px 1fr 1fr; gap: 6px;
    padding: 0 14px 12px 14px;
  }
  .set-hdr{ font-size: 10px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px; text-align:center; }
  .set-num{
    display:flex; align-items:center; justify-content:center; font-family: var(--font-mono);
    color: var(--chalk-dim); font-size: 13px;
  }
  .set-input{
    background: var(--panel-raised); border: 1px solid var(--line); color: var(--chalk);
    font-family: var(--font-mono); font-size: 14px; text-align:center; border-radius: 6px;
    padding: 7px 4px; width: 100%;
  }
  .set-input:focus{ outline: none; border-color: var(--steel); }
  .set-controls{
    display:flex; gap:8px; padding: 2px 14px 12px 14px;
  }
  .set-ctrl-btn{
    flex:1; background: var(--panel-raised); border: 1px solid var(--line); color: var(--chalk-dim);
    font-family: var(--font-mono); font-size: 12px; text-transform:uppercase; letter-spacing:0.5px;
    border-radius: 6px; padding: 7px 0; text-align:center;
  }
  .set-ctrl-btn.remove{ color: var(--iron); }
  .progress-strip{
    margin: 4px 16px 20px 16px; padding: 12px 14px; background: var(--panel);
    border-radius: 10px; border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .progress-strip .num{ font-family: var(--font-display); font-size: 22px; color: var(--iron); }
  .progress-strip .lbl{ font-size: 11px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px;}
  .storage-notice{
    display:none; margin: 0 16px 14px 16px; padding: 10px 14px; background: rgba(201,79,61,0.15);
    border: 1px solid var(--iron); border-radius: 8px; font-size: 12px; color: var(--chalk);
  }
  .backup-row{
    display:flex; gap:8px; margin: 0 16px 16px 16px;
  }
  .backup-btn{
    flex:1; background: var(--panel); border: 1px solid var(--line); color: var(--chalk-dim);
    font-family: var(--font-mono); font-size: 11px; text-transform:uppercase; letter-spacing:0.5px;
    border-radius: 8px; padding: 9px 0; text-align:center;
  }
  .backup-textarea{
    width: 100%; min-height: 90px; background: var(--panel-raised); color: var(--chalk);
    border: 1px solid var(--line); border-radius: 8px; font-family: var(--font-mono);
    font-size: 10px; padding: 8px; margin-top: 8px; box-sizing: border-box;
  }
  .ex-remove-btn{
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size: 12px; color: var(--chalk-dim);
    flex-shrink:0;
  }
  .ex-remove-btn.confirming{ background: var(--iron); border-color: var(--iron); color: var(--bg); }
  .add-ex-box{
    margin: 0 16px 16px 16px; padding: 12px 14px; background: var(--panel);
    border: 1px dashed var(--line); border-radius: 10px;
  }
  .add-ex-input{
    width:100%; background: var(--panel-raised); border: 1px solid var(--line); color: var(--chalk);
    font-family: var(--font-body); font-size: 14px; border-radius: 6px; padding: 8px 10px;
    margin-bottom: 8px; box-sizing: border-box;
  }
  .save-note{
    text-align:center; font-size: 11px; color: var(--chalk-dim); font-family: var(--font-mono);
    padding: 6px 16px; opacity: 0.7;
  }
</style>
<script>
(function(){
  const PLAN = {
    d1: { label: "Push A", exercises: [
      {n:"Bench Press", t:"4×6-8", icon:"vert", video:"hWbUlkb5Ms4"},
      {n:"DB Shoulder Press", t:"3×8-10", icon:"vert", video:"k6tzKisR3NY"},
      {n:"Incline DB Press", t:"3×10", icon:"vert", video:"8fXfwG4ftaQ"},
      {n:"Lateral Raises", t:"3×12-15", icon:"diag", video:"Kl3LEzQ5Zqs"},
      {n:"Triceps Pushdown", t:"3×10-12", icon:"vert", video:"1FjkhpZsaxc"},
      {n:"Lying Leg Raise", t:"3×12", icon:"arc"},
      {n:"Plank", t:"3×30-45s", icon:"pulse"},
    ]},
    d2: { label: "Pull A", exercises: [
      {n:"Pull-ups / Lat Pulldown", t:"4×8-10", icon:"vert", video:"RFgiCDJs8Nk"},
      {n:"Barbell/DB Row", t:"3×8-10", icon:"horiz"},
      {n:"Seated Cable Row", t:"3×10", icon:"horiz"},
      {n:"Face Pulls", t:"3×12-15", icon:"diag", video:"ujbqJ3ZHABk"},
      {n:"Barbell/DB Curl", t:"3×10-12", icon:"arc"},
    ]},
    d3: { label: "Legs", exercises: [
      {n:"Squat", t:"4×6-8", icon:"pulse", video:"dW3zj79xfrc"},
      {n:"Leg Press / Lunges", t:"3×10-12", icon:"pulse"},
      {n:"Leg Curl", t:"3×12", icon:"arc"},
      {n:"Hip Thrust", t:"3×10-12", icon:"pulse"},
      {n:"Calf Raises", t:"4×15", icon:"pulse"},
    ]},
    d4: { label: "Push B", exercises: [
      {n:"DB Shoulder Press", t:"4×6-8", icon:"vert", video:"k6tzKisR3NY"},
      {n:"Flat/Incline DB Press", t:"3×10", icon:"vert", video:"8fXfwG4ftaQ"},
      {n:"Cable Flyes", t:"3×12", icon:"arc"},
      {n:"Lateral Raises", t:"3×12", icon:"diag", video:"Kl3LEzQ5Zqs"},
      {n:"Close-Grip Bench / Ext", t:"3×10-12", icon:"vert"},
    ]},
    d5: { label: "Pull B", exercises: [
      {n:"Barbell Row", t:"4×6-8", icon:"horiz"},
      {n:"Pull-ups / Lat Pulldown", t:"3×10", icon:"vert", video:"RFgiCDJs8Nk"},
      {n:"Seated Cable Row", t:"3×10", icon:"horiz"},
      {n:"Rear Delt Flyes", t:"3×12-15", icon:"diag", video:"H5UxZFl0lgk"},
      {n:"Hammer Curl", t:"3×10-12", icon:"arc"},
      {n:"Cable Crunch", t:"3×15", icon:"vert"},
      {n:"Russian Twist", t:"3×20", icon:"diag"},
    ]},
  };
  const DAY_ORDER = ["d1","d2","d3","d4","d5"];

  function videoBtn(ex){
    let href;
    if(ex.video && /^https?:\/\//.test(ex.video)){
      href = ex.video;
    }else if(ex.video){
      href = `https://www.youtube.com/shorts/${ex.video}`;
    }else{
      href = `https://www.youtube.com/@athleanx/search?query=${encodeURIComponent(ex.n.replace(/\//g,' ') + " form")}`;
    }
    return `<a class="ex-video-btn" href="${href}" target="_blank" rel="noopener noreferrer" title="Watch form video">
      <svg viewBox="0 0 24 24" fill="var(--iron)"><polygon points="6,4 20,12 6,20"/></svg>
    </a>`;
  }

  let state = { week: 1, activeDay: "d1", data: {}, showBackupBox: false, backupMode: null, backupText: "",
    showAddExerciseFor: null, newExName: "", newExTarget: "", newExVideo: "", pendingRemoveKey: null };

  function weekKey(w){ return "week:" + w; }

  let memoryFallback = {};
  let usingFallback = (typeof window.storage === 'undefined');
  let usingLocalStorage = usingFallback ? localStorageWorks() : false;
  let lastErrorMsg = "";

  // Detect if localStorage actually works here (fails inside Claude's sandboxed artifact view, works in a real browser)
  function localStorageWorks(){
    try{
      const testKey = "__trackfit_test__";
      window.localStorage.setItem(testKey, "1");
      window.localStorage.removeItem(testKey);
      return true;
    }catch(e){
      return false;
    }
  }

  async function loadWeek(w){
    const key = weekKey(w);
    if(usingFallback){
      if(usingLocalStorage){
        const raw = window.localStorage.getItem(key);
        return raw ? JSON.parse(raw) : { bw: "", days: {} };
      }
      return memoryFallback[key] ? JSON.parse(memoryFallback[key]) : { bw: "", days: {} };
    }
    try{
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : { bw: "", days: {} };
    }catch(e){
      return { bw: "", days: {} };
    }
  }

  async function saveWeek(w, weekData){
    const key = weekKey(w);
    if(usingFallback){
      if(usingLocalStorage){
        window.localStorage.setItem(key, JSON.stringify(weekData));
      }else{
        memoryFallback[key] = JSON.stringify(weekData);
      }
      showFallbackNotice();
      return;
    }
    // try once, then retry once after a short delay before falling back
    for(let attempt = 0; attempt < 2; attempt++){
      try{
        const result = await window.storage.set(key, JSON.stringify(weekData), false);
        if(!result){ throw new Error("Empty result from storage.set"); }
        return; // success
      }catch(e){
        lastErrorMsg = (e && e.message) ? e.message : String(e);
        console.error(`Storage save attempt ${attempt + 1} failed:`, e);
        if(attempt === 0){
          await new Promise(r => setTimeout(r, 400));
        }
      }
    }
    // both attempts failed, fall back for this session
    usingFallback = true;
    usingLocalStorage = localStorageWorks();
    if(usingLocalStorage){
      window.localStorage.setItem(key, JSON.stringify(weekData));
    }else{
      memoryFallback[key] = JSON.stringify(weekData);
    }
    showFallbackNotice();
  }

  function showFallbackNotice(){
    const note = document.getElementById('storage-notice');
    if(note){
      if(usingLocalStorage){
        note.style.display = 'none'; // saving fine via localStorage, no need to alarm the user
      }else{
        note.style.display = 'block';
        const detail = document.getElementById('storage-notice-detail');
        if(detail) detail.textContent = lastErrorMsg ? `Error: ${lastErrorMsg}` : "";
      }
    }
  }

  function getDayData(weekData, dayId){
    if(!weekData.days[dayId]){
      weekData.days[dayId] = { done: {}, sets: {}, date: "" };
    }
    return weekData.days[dayId];
  }

  function getEffectiveExercises(dayId, overrides){
    const dayOverride = (overrides && overrides[dayId]) || { removedBase: [], custom: [] };
    const base = PLAN[dayId].exercises
      .map((ex, i) => ({ ...ex, key: `b${i}`, isCustom: false, baseIndex: i }))
      .filter(ex => !(dayOverride.removedBase || []).includes(ex.baseIndex));
    const custom = (dayOverride.custom || []).map(c => ({
      n: c.n, t: c.t || "", video: c.video || null, icon: "vert", key: c.id, isCustom: true
    }));
    return [...base, ...custom];
  }

  function overridesKey(){ return "trackfit-plan-overrides"; }

  async function loadOverrides(){
    const key = overridesKey();
    if(usingFallback){
      if(usingLocalStorage){
        const raw = window.localStorage.getItem(key);
        return raw ? JSON.parse(raw) : {};
      }
      return memoryFallback[key] ? JSON.parse(memoryFallback[key]) : {};
    }
    try{
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : {};
    }catch(e){
      return {};
    }
  }

  async function saveOverrides(overrides){
    const key = overridesKey();
    if(usingFallback){
      if(usingLocalStorage){
        window.localStorage.setItem(key, JSON.stringify(overrides));
      }else{
        memoryFallback[key] = JSON.stringify(overrides);
      }
      return;
    }
    try{
      await window.storage.set(key, JSON.stringify(overrides), false);
    }catch(e){
      usingFallback = true;
      usingLocalStorage = localStorageWorks();
      if(usingLocalStorage){
        window.localStorage.setItem(key, JSON.stringify(overrides));
      }else{
        memoryFallback[key] = JSON.stringify(overrides);
      }
    }
  }

  function ensureSets(dayData, exIdx){
    if(!dayData.sets[exIdx]){
      dayData.sets[exIdx] = [{w:"",r:""},{w:"",r:""},{w:"",r:""},{w:"",r:""}];
    }
    return dayData.sets[exIdx];
  }

  async function render(){
    const app = document.getElementById("app");
    const weekData = await loadWeek(state.week);
    state.currentWeekData = weekData;
    const overrides = await loadOverrides();
    state.currentOverrides = overrides;

    let html = "";
    html += `<div class="plate-row"><div class="plate"></div><div class="plate"></div><div class="plate"></div></div>`;
    html += `<div class="header">
      <h1 class="title">TRACKFIT</h1>
      <div class="subtitle">176CM · PUSH / PULL / LEGS</div>
    </div>`;

    html += `<div class="storage-notice" id="storage-notice" style="${usingFallback ? 'display:block;' : ''}">⚠ Running without persistent save — data will reset if you close this. Open TrackFit through the Claude app for it to save between sessions.<div id="storage-notice-detail" style="margin-top:4px; opacity:0.75; font-family: var(--font-mono); font-size:10px;"></div></div>`;

    html += `<div class="week-nav">
      <div class="week-btn" data-action="prev-week">‹</div>
      <div class="week-label">WEEK ${state.week}</div>
      <div class="week-btn" data-action="next-week">›</div>
    </div>`;

    html += `<div class="bw-row">
      <div>
        <div class="bw-label">Bodyweight this week</div>
        <div class="bw-goal">Start 61kg → Goal 65kg</div>
      </div>
      <input class="bw-input" id="bw-input" type="number" step="0.1" placeholder="--" value="${weekData.bw || ""}" />
    </div>`;

    html += `<div class="day-tabs">`;
    DAY_ORDER.forEach(dayId => {
      const dayData = weekData.days[dayId];
      const dayExercises = getEffectiveExercises(dayId, overrides);
      const doneCount = dayData ? Object.values(dayData.done).filter(Boolean).length : 0;
      const total = dayExercises.length;
      const isActive = state.activeDay === dayId;
      const dotShow = doneCount > 0 && doneCount < total;
      const allDone = doneCount === total && total > 0;
      const hasDate = dayData && dayData.date;
      html += `<div class="day-tab ${isActive ? 'active' : ''}" data-action="select-day" data-day="${dayId}">
        ${PLAN[dayId].label}${allDone ? ' ✓' : (dotShow ? '<span class="dot"></span>' : '')}${hasDate ? ` · ${dayData.date.slice(5)}` : ''}
      </div>`;
    });
    html += `</div>`;

    const dayData = getDayData(weekData, state.activeDay);
    const exercises = getEffectiveExercises(state.activeDay, overrides);

    html += `<div class="date-row">
      <div class="date-label">${PLAN[state.activeDay].label} date</div>
      <input class="date-input" id="date-input" type="date" value="${dayData.date || ""}" />
    </div>`;

    exercises.forEach((ex) => {
      const isDone = !!dayData.done[ex.key];
      const sets = ensureSets(dayData, ex.key);
      html += `<div class="exercise">
        <div class="ex-head">
          <div class="ex-name-wrap">
            ${videoBtn(ex)}
            <div>
              <div class="ex-name">${ex.n}</div>
              <div class="ex-target">TARGET ${ex.t || '—'}</div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="ex-remove-btn ${state.pendingRemoveKey === ex.key ? 'confirming' : ''}" data-action="remove-exercise" data-key="${ex.key}" data-custom="${ex.isCustom ? '1' : '0'}" title="Remove exercise">${state.pendingRemoveKey === ex.key ? '✓' : '✕'}</div>
            <div class="ex-check ${isDone ? 'done' : ''}" data-action="toggle-done" data-key="${ex.key}">${isDone ? '✓' : ''}</div>
          </div>
        </div>
        <div class="sets-grid">
          <div class="set-hdr">SET</div>
          <div class="set-hdr">KG</div>
          <div class="set-hdr">REPS</div>
        </div>`;
      sets.forEach((s, si) => {
        html += `<div class="sets-grid">
          <div class="set-num">${si+1}</div>
          <input class="set-input" type="number" placeholder="0" value="${s.w}" data-action="set-weight" data-key="${ex.key}" data-si="${si}" />
          <input class="set-input" type="number" placeholder="0" value="${s.r}" data-action="set-reps" data-key="${ex.key}" data-si="${si}" />
        </div>`;
      });
      html += `<div class="set-controls">
        <div class="set-ctrl-btn" data-action="add-set" data-key="${ex.key}">+ Add set</div>
        <div class="set-ctrl-btn remove" data-action="remove-set" data-key="${ex.key}">− Remove set</div>
      </div>`;
      html += `</div>`;
    });

    html += `<div class="backup-btn" style="margin: 0 16px 12px 16px;" data-action="show-add-exercise">+ Add exercise to ${PLAN[state.activeDay].label}</div>`;
    if(state.showAddExerciseFor === state.activeDay){
      html += `<div class="add-ex-box">
        <input class="add-ex-input" id="new-ex-name" type="text" placeholder="Exercise name" value="${state.newExName || ''}" />
        <input class="add-ex-input" id="new-ex-target" type="text" placeholder="Target e.g. 3x10" value="${state.newExTarget || ''}" />
        <input class="add-ex-input" id="new-ex-video" type="text" placeholder="YouTube link (optional)" value="${state.newExVideo || ''}" />
        <div class="backup-btn" data-action="save-new-exercise" style="margin-top:6px;">Save exercise</div>
      </div>`;
    }

    const totalExercises = DAY_ORDER.reduce((sum, d) => sum + getEffectiveExercises(d, overrides).length, 0);
    let totalDone = 0;
    DAY_ORDER.forEach(d => {
      const dd = weekData.days[d];
      if(dd) totalDone += Object.values(dd.done).filter(Boolean).length;
    });

    html += `<div class="progress-strip">
      <div>
        <div class="num">${totalDone}/${totalExercises}</div>
        <div class="lbl">Exercises logged this week</div>
      </div>
    </div>`;

    html += `<div class="save-note">${usingFallback ? (usingLocalStorage ? 'Saved on this device (offline mode)' : 'Not saving between sessions — back up your data below') : 'Saved automatically on this device'}</div>`;

    html += `<div class="backup-row">
      <div class="backup-btn" data-action="export-data">Export backup</div>
      <div class="backup-btn" data-action="import-data">Restore backup</div>
    </div>`;
    if(state.showBackupBox){
      html += `<div style="margin:0 16px 20px 16px;">
        <textarea class="backup-textarea" id="backup-textarea" placeholder="${state.backupMode === 'import' ? 'Paste your backup text here, then tap Restore backup again' : ''}">${state.backupMode === 'export' ? state.backupText : ''}</textarea>
      </div>`;
    }

    app.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers(){
    const app = document.getElementById("app");

    app.querySelectorAll('[data-action="prev-week"]').forEach(el => {
      el.onclick = () => { if(state.week > 1){ state.week--; render(); } };
    });
    app.querySelectorAll('[data-action="next-week"]').forEach(el => {
      el.onclick = () => { state.week++; render(); };
    });
    app.querySelectorAll('[data-action="select-day"]').forEach(el => {
      el.onclick = () => { state.activeDay = el.getAttribute('data-day'); render(); };
    });

    const dateInput = document.getElementById('date-input');
    if(dateInput){
      dateInput.onchange = async (e) => {
        const wd = state.currentWeekData;
        const dd = getDayData(wd, state.activeDay);
        dd.date = e.target.value;
        await saveWeek(state.week, wd);
      };
    }

    const bwInput = document.getElementById('bw-input');
    if(bwInput){
      bwInput.onchange = async (e) => {
        const wd = state.currentWeekData;
        wd.bw = e.target.value;
        await saveWeek(state.week, wd);
      };
    }

    app.querySelectorAll('[data-action="export-data"]').forEach(el => {
      el.onclick = () => {
        const wd = state.currentWeekData;
        const backup = { week: state.week, data: wd };
        state.backupText = JSON.stringify(backup);
        state.backupMode = 'export';
        state.showBackupBox = true;
        render();
      };
    });

    app.querySelectorAll('[data-action="import-data"]').forEach(el => {
      el.onclick = async () => {
        if(state.showBackupBox && state.backupMode === 'import'){
          const box = document.getElementById('backup-textarea');
          try{
            const parsed = JSON.parse(box.value);
            if(parsed && parsed.week && parsed.data){
              state.week = parsed.week;
              const wd = parsed.data;
              if(usingFallback){
                memoryFallback[weekKey(state.week)] = JSON.stringify(wd);
              }else{
                await saveWeek(state.week, wd);
              }
              state.showBackupBox = false;
              render();
            }
          }catch(e){
            const box = document.getElementById('backup-textarea');
            if(box) box.placeholder = "Couldn't read that — check it's pasted correctly and try again.";
          }
        }else{
          state.backupMode = 'import';
          state.showBackupBox = true;
          render();
        }
      };
    });

    app.querySelectorAll('[data-action="show-add-exercise"]').forEach(el => {
      el.onclick = () => {
        state.showAddExerciseFor = state.activeDay;
        state.newExName = ""; state.newExTarget = ""; state.newExVideo = "";
        render();
      };
    });

    app.querySelectorAll('[data-action="save-new-exercise"]').forEach(el => {
      el.onclick = async () => {
        const nameEl = document.getElementById('new-ex-name');
        const targetEl = document.getElementById('new-ex-target');
        const videoEl = document.getElementById('new-ex-video');
        const name = (nameEl.value || "").trim();
        if(!name){
          nameEl.style.borderColor = 'var(--iron)';
          nameEl.placeholder = 'Name is required';
          return;
        }
        const overrides = state.currentOverrides || {};
        if(!overrides[state.activeDay]) overrides[state.activeDay] = { removedBase: [], custom: [] };
        overrides[state.activeDay].custom.push({
          id: "c" + Date.now() + Math.floor(Math.random()*1000),
          n: name,
          t: (targetEl.value || "").trim(),
          video: (videoEl.value || "").trim() || null
        });
        await saveOverrides(overrides);
        state.showAddExerciseFor = null;
        render();
      };
    });

    app.querySelectorAll('[data-action="remove-exercise"]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-key');
        const isCustom = el.getAttribute('data-custom') === '1';
        if(state.pendingRemoveKey !== key){
          // first tap: ask for confirmation inline (no native popup, which is blocked in this sandbox)
          state.pendingRemoveKey = key;
          render();
          return;
        }
        // second tap: actually remove
        state.pendingRemoveKey = null;
        const overrides = state.currentOverrides || {};
        if(!overrides[state.activeDay]) overrides[state.activeDay] = { removedBase: [], custom: [] };
        if(isCustom){
          overrides[state.activeDay].custom = (overrides[state.activeDay].custom || []).filter(c => c.id !== key);
        }else{
          const baseIndex = parseInt(key.replace('b',''), 10);
          if(!overrides[state.activeDay].removedBase.includes(baseIndex)){
            overrides[state.activeDay].removedBase.push(baseIndex);
          }
        }
        await saveOverrides(overrides);
        render();
      };
    });

    app.querySelectorAll('[data-action="add-set"]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-key');
        const wd = state.currentWeekData;
        const dd = getDayData(wd, state.activeDay);
        const sets = ensureSets(dd, key);
        sets.push({w:"", r:""});
        await saveWeek(state.week, wd);
        render();
      };
    });

    app.querySelectorAll('[data-action="remove-set"]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-key');
        const wd = state.currentWeekData;
        const dd = getDayData(wd, state.activeDay);
        const sets = ensureSets(dd, key);
        if(sets.length > 1){ sets.pop(); }
        await saveWeek(state.week, wd);
        render();
      };
    });

    app.querySelectorAll('[data-action="toggle-done"]').forEach(el => {
      el.onclick = async () => {
        const key = el.getAttribute('data-key');
        const wd = state.currentWeekData;
        const dd = getDayData(wd, state.activeDay);
        dd.done[key] = !dd.done[key];
        await saveWeek(state.week, wd);
        render();
      };
    });

    app.querySelectorAll('[data-action="set-weight"], [data-action="set-reps"]').forEach(el => {
      el.onchange = async (e) => {
        const key = el.getAttribute('data-key');
        const si = el.getAttribute('data-si');
        const wd = state.currentWeekData;
        const dd = getDayData(wd, state.activeDay);
        const sets = ensureSets(dd, key);
        const field = el.getAttribute('data-action') === 'set-weight' ? 'w' : 'r';
        sets[si][field] = e.target.value;
        await saveWeek(state.week, wd);
      };
    });
  }

  render();
})();
</script>
</body>
</html>
